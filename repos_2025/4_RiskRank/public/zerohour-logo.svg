<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" opacity="0.15" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4" />
  <!-- Lightning bolt / Z shape -->
  <path d="M 115 30 L 70 105 L 95 105 L 80 170 L 130 88 L 105 88 Z"
    fill="url(#grad)" filter="url(#glow)" />
</svg>
