{% extends "base.html" %}
{% block title %}Onboarding - Kaizen{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4">
    <div
        class="max-w-2xl w-full space-y-8 bg-slate-800/50 p-10 rounded-2xl border border-slate-700 backdrop-blur-md shadow-2xl">
        <div class="text-center">
            <h2 class="mt-2 text-3xl font-extrabold text-white">Let's get to know you</h2>
            <p class="mt-2 text-sm text-slate-400">Complete your profile to unlock personalized physiotherapy.</p>
        </div>

        <form class="mt-8 space-y-8" method="POST" action="{{ url_for('onboarding') }}" enctype="multipart/form-data">

            <div class="space-y-6 shadow-sm">
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                    <input id="name" name="name" type="text" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-600 bg-slate-900/50 placeholder-slate-400 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm"
                        placeholder="e.g. John Doe">
                </div>

                <!-- Medical Report Upload Field (Optional) -->
                <div>
                    <label for="report" class="block text-sm font-medium text-slate-300 mb-2">Medical Report
                        (Optional)</label>
                    <div
                        class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-slate-600 border-dashed rounded-xl hover:border-blue-500 transition-colors bg-slate-900/30">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none"
                                viewBox="0 0 48 48" aria-hidden="true">
                                <path
                                    d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-slate-400 justify-center">
                                <label for="report"
                                    class="relative cursor-pointer bg-slate-800 rounded-md font-medium text-blue-400 hover:text-blue-300 focus-within:outline-none px-2 py-1">
                                    <span>Upload a file</span>
                                    <input id="report" name="report" type="file" class="sr-only"
                                        accept=".png,.jpg,.jpeg,.pdf">
                                </label>
                                <p class="pl-1 leading-loose">or drag and drop</p>
                            </div>
                            <p class="text-xs text-slate-500">
                                PNG, JPG, PDF up to 10MB
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-900 transition-all shadow-lg shadow-blue-500/25">
                    Complete Setup
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Quick script to update text when a file is selected
    document.getElementById('report').addEventListener('change', function (e) {
        var fileName = e.target.files[0] ? e.target.files[0].name : "Upload a file";
        e.target.parentElement.querySelector('span').textContent = fileName;
    });
</script>
{% endblock %}
