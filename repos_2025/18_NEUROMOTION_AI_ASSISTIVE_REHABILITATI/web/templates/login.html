{% extends "base.html" %}
{% block title %}Sign In - Kaizen{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4">
    <div
        class="max-w-md w-full space-y-8 bg-slate-800/50 p-10 rounded-2xl border border-slate-700 backdrop-blur-md shadow-2xl">
        <div class="text-center">
            <h2 class="mt-2 text-3xl font-extrabold text-white">Welcome Back</h2>
            <p class="mt-2 text-sm text-slate-400">Please sign in to your account</p>
        </div>

        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('login') }}">
            <div class="rounded-md space-y-4 shadow-sm">
                <div>
                    <label for="email" class="sr-only">Email address</label>
                    <input id="email" name="email" type="email" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-600 bg-slate-900/50 placeholder-slate-400 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm"
                        placeholder="Email address">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-600 bg-slate-900/50 placeholder-slate-400 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all sm:text-sm"
                        placeholder="Password">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-900 transition-all shadow-lg shadow-blue-500/25">
                    Sign In
                </button>
            </div>

            <div class="text-center mt-4">
                <p class="text-sm text-slate-400">
                    Don't have an account?
                    <a href="{{ url_for('register') }}"
                        class="font-medium text-blue-400 hover:text-blue-300 transition-colors">Sign up here</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
